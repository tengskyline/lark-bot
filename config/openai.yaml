# OpenAI 配置
openai:
  # API 密钥 (必需)
  api_key: "your-openai-api-key-here"
  
  # 自定义 API 端点 (可选，用于使用代理或其他兼容服务)
  base_url: ""
  
  # 使用的模型
  model: "gpt-4o-mini"  # 可选: gpt-4o, gpt-4o-mini, gpt-4-turbo, gpt-3.5-turbo
  
  # 最大 token 数
  max_tokens: 4000
  
  # 温度参数 (0.0-2.0)
  temperature: 0.7
  
  # 请求超时时间
  timeout: "60s"
  
  # 最大重试次数
  max_retries: 3

# 系统提示词配置
system_prompt: |
  你是一个有用的AI助手，专门帮助用户解答问题。
  请用简洁、准确的方式回答问题。
  如果遇到不确定的问题，请诚实说明。

# 对话历史配置
conversation:
  # 最大历史消息数
  max_history: 10
  
  # 是否启用上下文记忆
  enable_context: true 